# nginx-proxy/conf.d/kobo-interns.xyz.conf - With SSL termination
server {
    listen 80;
    server_name kobo-interns.xyz www.kobo-interns.xyz;

    # ACME challenge location for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# nginx-proxy/conf.d/kobo-interns.xyz.conf - Configuration for kobo-interns.xyz
server {
    listen 443 ssl;
    server_name kobo-interns.xyz www.kobo-interns.xyz;

    ssl_certificate /etc/letsencrypt/live/www.kobo-interns.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kobo-interns.xyz/privkey.pem;

    # Strong SSL Confirguration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://kobo-interns.xyz:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

