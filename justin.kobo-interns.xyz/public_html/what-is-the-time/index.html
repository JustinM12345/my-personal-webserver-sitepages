<!DOCTYPE html>
<html>
    <head>
        <title>Server Time</title>
    </head>
    <body>
        <h1>Server Time</h1>
    </body>

    <img src="images/rome_rabbit.png" alt="Rome Rabbit" style="width:256px;height:256px;">

    <br>
    <br>

    <script language="javascript">
        let urlString = window.location.href;
        let paramString = urlString.split('?')[1];
        let queryString = new URLSearchParams(paramString);
        var localTime = new Date();
        var count = 0;

        for (pair of queryString.entries()){
            if (pair[0] == "name") {
                document.write("Hi " + pair[1] + "! The time is " + localTime + "<br>");
                count++;
                break;
            }
        }
        if (count == 0){
            document.write("Hi mysterious stranger! The time is: " + localTime + "<br>");
        }
        // document.write("Server time is: " + date);
        // document.write("Heres a change to the docker image");
        // trigger workflow?
    </script>
</html>
